<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2ebf91">
<title>Material | Contabilidade - Acompanhamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--neon:#eaff00;--neon-soft:#f4ff8a;font-family:Ubuntu,sans-serif;font-weight:300}*{box-sizing:border-box}html,body,button,a{font-family:Ubuntu,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(to right,#2ebf91,#8360c3)}body:before,body:after{content:"";position:fixed;width:34rem;height:34rem;border-radius:50%;filter:blur(2px);pointer-events:none}body:before{top:-17rem;left:-12rem;background:radial-gradient(circle,#d3fff277,transparent 68%)}body:after{right:-14rem;bottom:-19rem;background:radial-gradient(circle,#f1d4ff66,transparent 68%)}.card{position:relative;width:min(92vw,570px);padding:clamp(28px,6vw,54px);border:1px solid #ffffff77;border-radius:28px;text-align:center;background:linear-gradient(145deg,#ffffff30,#ffffff0d 58%,#eaff0010);box-shadow:0 28px 90px #14112655,0 0 42px #eaff0022,inset 0 1px #ffffff99,inset 0 -1px #ffffff20;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:1}.mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 22px;border:1px solid var(--neon);border-radius:20px;background:#eaff001c;color:var(--neon);font-size:27px;box-shadow:0 0 24px #eaff0033,0 8px 28px #0002}.eyebrow{margin:0 0 10px;color:var(--neon);font-size:12px;font-weight:300;letter-spacing:.19em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,6vw,42px);letter-spacing:-.045em;line-height:1.12;font-weight:400}.subtitle{max-width:390px;margin:16px auto 30px;color:#ffffffd9;font-size:15px;line-height:1.65}.button{display:inline-block;cursor:pointer;color:#fff;font-size:15px;font-weight:300;padding:11px 24px;text-decoration:none;text-shadow:0 1px 0 #cc9f52;border-radius:6px;border:1px solid #eeb44f;background:linear-gradient(to bottom,#ffc477 5%,#fb9e25 100%);box-shadow:inset 0 1px 0 #fce2c1;transition:transform .2s,box-shadow .2s}.button:hover{background:linear-gradient(to bottom,#fb9e25 5%,#ffc477 100%);transform:translateY(-2px);box-shadow:0 0 18px #eaff0055,inset 0 1px 0 #fce2c1}.button:active{transform:none}.button:focus-visible{outline:3px solid var(--neon);outline-offset:3px}.fineprint{margin:23px 0 0;color:#ffffffb8;font-size:12px}.loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#10101f88;backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);transition:opacity .35s,visibility .35s}.loading.done{opacity:0;visibility:hidden;pointer-events:none}.loading-card{width:min(90vw,410px);padding:36px 28px;border:1px solid #ffffff8c;border-radius:24px;text-align:center;background:linear-gradient(145deg,#ffffff30,#ffffff12);box-shadow:0 24px 80px #1d174144,0 0 36px #eaff0033,inset 0 1px #ffffff99;backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}.spinner{width:54px;height:54px;margin:0 auto 22px;border:4px solid #ffffff4a;border-top-color:var(--neon);border-radius:50%;box-shadow:0 0 20px #eaff0044;animation:spin .85s linear infinite}.loading h2{margin:0;font-size:20px;line-height:1.35;font-weight:400}.loading p{margin:10px 0 0;color:#ffffffd4;font-size:14px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section class="card" aria-labelledby="title">
  <div class="mark" aria-hidden="true">✦</div>
  <p class="eyebrow">TrHUB · Central de documentos</p>
  <h1 id="title">Material | Contabilidade</h1>
  <p class="subtitle">Visualize o material de apoio de Contabilidade e Acompanhamento diretamente nesta janela.</p>
  <button class="button" type="button" id="openPdf">Visualizar Material de Apoio</button>
  <p class="fineprint">Documento de apoio · TrHUB</p>
</section>
<div class="loading" id="pageLoading" role="status" aria-live="polite"><div class="loading-card"><div class="spinner" aria-hidden="true"></div><h2 id="loadingTitle">Preparando seu material</h2><p id="loadingText">Material | Contabilidade - Acompanhamento</p></div></div>
<script>
const githubUrl='https://github.com/iramalho1980/pdf_contabilidade/blob/c4a103426d3002b58c78257868e41bf2dc0232bc/TrHUB%20_%20Material%20de%20Apoio%20-%20Contabilidade%20Acompanhamento.pdf';
const rawUrl=githubUrl.replace('https://github.com/','https://raw.githubusercontent.com/').replace('/blob/','/');
const viewerUrl='https://mozilla.github.io/pdf.js/web/viewer.html?file='+encodeURIComponent(rawUrl);
function openPdf(){
  const width=screen.availWidth,height=screen.availHeight,left=screen.availLeft||0,top=screen.availTop||0;
  const pageLoading=document.getElementById('pageLoading');
  document.getElementById('loadingTitle').textContent='Abrindo seu PDF';
  document.getElementById('loadingText').textContent='Preparando o visualizador…';
  pageLoading.classList.remove('done');
  const popup=window.open('','materialContabilidade',`popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`);
  if(!popup){pageLoading.classList.add('done');alert('O navegador bloqueou o popup. Permita popups para esta página e tente novamente.');return;}
  popup.document.open();
  popup.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrHUB | Material de Apoio - Contabilidade</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--neon:#eaff00}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;overflow:hidden;font:300 15px Ubuntu,sans-serif;color:#fff;background:linear-gradient(to right,#2ebf91,#8360c3)}body:before,body:after{content:"";position:fixed;width:34rem;height:34rem;border-radius:50%;pointer-events:none}body:before{top:-17rem;left:-12rem;background:radial-gradient(circle,#d3fff277,transparent 68%)}body:after{right:-14rem;bottom:-19rem;background:radial-gradient(circle,#f1d4ff66,transparent 68%)}.dialog{position:relative;z-index:1;width:97vw;height:92vh;overflow:hidden;display:flex;flex-direction:column;border:1px solid #ffffff80;border-radius:24px;background:linear-gradient(140deg,#ffffff20,#ffffff0c 48%,#2ebf9122);color:#172033;box-shadow:0 35px 120px #090b1c99,0 0 42px #eaff0033,inset 0 1px #ffffff88;backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);animation:appear .22s ease-out}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;padding:14px 18px;background:#ffffffc9;border-bottom:1px solid #ffffffaa;box-shadow:0 4px 24px #10182712}.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:300}.actions{display:flex;align-items:center;gap:10px;flex:none}.download{padding:8px 16px;border:1px solid #eeb44f;border-radius:6px;background:linear-gradient(to bottom,#ffc477 5%,#fb9e25 100%);box-shadow:inset 0 1px #fce2c1;color:#fff;text-decoration:none;font-size:14px;text-shadow:0 1px #cc9f52}.close{width:38px;height:38px;padding:0;border:0;border-radius:12px;background:#edf0f5;color:#334155;font:300 22px Ubuntu,sans-serif;cursor:pointer}.frame{width:100%;flex:1;min-height:0;border:0;padding:12px;background:#1720334d}.veil{position:absolute;inset:66px 0 0;z-index:3;display:grid;place-items:center;padding:18px;background:#10101f88;backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);transition:opacity .35s,visibility .35s}.veil.done{opacity:0;visibility:hidden;pointer-events:none}.loader{width:min(90vw,410px);padding:36px 28px;border:1px solid #ffffff8c;border-radius:24px;text-align:center;background:linear-gradient(145deg,#ffffff30,#ffffff12);box-shadow:0 24px 80px #1d174144,0 0 36px #eaff0033,inset 0 1px #ffffff99;backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}.spin{width:54px;height:54px;margin:0 auto 22px;border:4px solid #ffffff4a;border-top-color:var(--neon);border-radius:50%;box-shadow:0 0 20px #eaff0044;animation:spin .85s linear infinite}.loader h2{margin:0;font-size:20px;font-weight:400}.loader p{margin:10px 0 0;color:#ffffffd4;font-size:14px}.progress{height:5px;margin-top:24px;overflow:hidden;border-radius:9px;background:#ffffff45}.progress span{display:block;width:15%;height:100%;border-radius:inherit;background:var(--neon);box-shadow:0 0 14px #eaff00;transition:width 12s linear}.fallback{margin-top:14px;color:#347c76;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}@media(max-width:600px){.dialog{width:100vw;height:100vh;border-radius:0}.head{padding:10px}.title{font-size:12px}.download{padding:8px 10px;font-size:12px}.veil{inset:58px 0 0}}</style></head><body><section class="dialog"><header class="head"><div class="title">TrHUB | Material de Apoio - Contabilidade Acompanhamento</div><div class="actions"><a class="download" href="${rawUrl}" download="TrHUB - Material de Apoio - Contabilidade Acompanhamento.pdf">Baixar PDF</a><button class="close" id="close" title="Fechar visualizador" aria-label="Fechar">×</button></div></header><iframe class="frame" id="pdf" title="Visualizador do PDF"></iframe><div class="veil" id="veil"><div class="loader"><div class="spin" aria-hidden="true"></div><h2>TrHUB | Material de Apoio</h2><p id="status">Preparando seu PDF…</p><div class="progress"><span id="progress"></span></div><a class="fallback" href="${githubUrl}" target="_blank" rel="noopener">Se não abrir, acessar o PDF no GitHub</a></div></div></section><script>const frame=document.getElementById('pdf'),veil=document.getElementById('veil'),bar=document.getElementById('progress');frame.src=${JSON.stringify(viewerUrl)};bar.style.width='72%';frame.addEventListener('load',()=>{bar.style.width='100%';document.getElementById('status').textContent='PDF carregado';setTimeout(()=>veil.classList.add('done'),700)});document.getElementById('close').onclick=()=>window.close();setTimeout(()=>{if(!veil.classList.contains('done'))document.getElementById('status').textContent='O PDF está demorando. Você ainda pode abrir o link abaixo.'},15000);<\/script></body></html>`);
  popup.document.close();
  popup.focus();
  setTimeout(()=>pageLoading.classList.add('done'),850);
}
document.getElementById('openPdf').addEventListener('click',openPdf);
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('pageLoading').classList.add('done'),900));
</script>
</body>
</html>
